<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Book of Palak</title>
<meta property="og:title" content="The Book of Palak">
<meta property="og:description" content="Chapter 26 is closed. Chapter 27 is already on its way.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500,600;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --parchment: #f3e9d2;
    --parchment-dark: #e6d7b3;
    --emerald: #0f3d2e;
    --ink: #1c1a17;
    --gold: #c9a35b;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.06), transparent 40%),
                linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    text-align: center;
  }
  .card{
    max-width: 420px;
    width: 100%;
  }
  .falcon{
    font-size: 2.6rem;
    margin-bottom: 0.3em;
    filter: drop-shadow(0 4px 8px rgba(15,61,46,0.35));
  }
  h1{
    font-weight: 600;
    font-size: 1.7rem;
    color: var(--emerald);
    margin: 0 0 0.2em;
    letter-spacing: 0.01em;
  }
  .closed-line{
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: var(--emerald);
    opacity: 0.85;
    margin: 0 0 1.6em;
  }
  .countdown-label{
    font-size: 1rem;
    opacity: 0.75;
    margin: 0 0 0.5em;
  }
  .countdown{
    font-family: 'Caveat', cursive;
    font-size: 2.6rem;
    color: var(--ink);
    margin: 0 0 1.4em;
    line-height: 1.1;
  }
  .countdown span{ display: inline-block; min-width: 1.4ch; }
  .note{
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 340px;
    margin: 0 auto;
    opacity: 0.85;
  }
  .signature{
    margin-top: 1.6em;
    font-family: 'Caveat', cursive;
    font-size: 1.2rem;
    color: var(--gold);
  }
</style>
</head>
<body>

<div class="card">
  <div class="falcon">🦅</div>
  <h1>The Book of Palak</h1>
  <p class="closed-line">Chapter 26 is closed. Mischief managed.</p>

  <p class="countdown-label">Chapter 27 begins in</p>
  <div class="countdown" id="countdown">—</div>

  <p class="note">The falcon's resting, the cake's finished, and the next chapter's already being written — quietly, one day at a time, same as always.</p>
  <p class="signature">— Boss</p>
</div>

<script>
  var target = new Date('2027-09-23T00:00:00+05:30').getTime();
  var el = document.getElementById('countdown');
  function tick(){
    var diff = target - Date.now();
    if (diff <= 0){ el.textContent = "Aa gaya din. Happy Birthday, Palak."; return; }
    var d = Math.floor(diff / 86400000);
    var h = Math.floor(diff / 3600000) % 24;
    var m = Math.floor(diff / 60000) % 60;
    var s = Math.floor(diff / 1000) % 60;
    el.innerHTML =
      '<span>' + d + '</span>d ' +
      '<span>' + String(h).padStart(2,'0') + '</span>:' +
      '<span>' + String(m).padStart(2,'0') + '</span>:' +
      '<span>' + String(s).padStart(2,'0') + '</span>';
    requestAnimationFrame(function(){ setTimeout(tick, 1000); });
  }
  tick();
</script>
</body>
</html>
